# Fitex рядом с 4talk (Toki) на одном Hetzner.
# Caddy из toki-app занимает 80/443 — nginx сюда не ставим.
#
# Пока нет DNS api.fitex.app — API доступен по http://SERVER_IP:3000
# (мобильное EXPO_PUBLIC_API_URL). Когда домен готов — можно сузить до
# 127.0.0.1:3001 и проксировать через Caddy (см. COLOCATE-4TALK.md).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fitex-api:latest
    container_name: fitex-api
    restart: unless-stopped
    env_file: .env
    environment:
      APPLE_ROOT_CA_DIR: /app/certs
      PORT: "3000"
    volumes:
      - ./certs:/app/certs:ro
      - fitex_uploads:/app/uploads
    ports:
      # публично — иначе телефон получает Network Error
      - "0.0.0.0:3000:3000"
    networks:
      - fitex-net
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fitex_uploads:

networks:
  fitex-net:
    driver: bridge
  proxy:
    external: true
    name: proxy
