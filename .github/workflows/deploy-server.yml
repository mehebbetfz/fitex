name: 🚀 Deploy Server to Hetzner

on:
  push:
    branches: [main]
    paths:
      - "fitex-server/**"
      - ".github/workflows/deploy-server.yml"

  workflow_dispatch:        # ручной запуск из GitHub UI

jobs:
  deploy:
    name: Build & Deploy NestJS API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Smoke-test: проверяем что TypeScript компилируется ─────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: fitex-server/fitex/package-lock.json

      - name: Install & build (CI check)
        working-directory: fitex-server/fitex
        run: |
          npm ci --ignore-scripts
          npm run build

      # ── Deploy via SSH ─────────────────────────────────────────────────────
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/opt/fitex"
            ENV_FILE="$APP_DIR/fitex-server/fitex/.env"
            ENV_BACKUP="/opt/fitex.env.backup"
            REPO="https://github.com/${{ github.repository }}.git"

            # Preserve secrets across git reset / accidental wipe
            if [ -f "$ENV_FILE" ]; then
              cp -a "$ENV_FILE" "$ENV_BACKUP"
              echo "Backed up .env → $ENV_BACKUP"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone "$REPO" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            cd "$APP_DIR/fitex-server/fitex"

            if [ ! -f ".env" ] && [ -f "$ENV_BACKUP" ]; then
              cp -a "$ENV_BACKUP" ".env"
              echo "Restored .env from $ENV_BACKUP"
            fi

            if [ ! -f ".env" ]; then
              echo "ERROR: .env missing at $ENV_FILE"
              echo "Copy from your PC: scp fitex-server/fitex/.env USER@HOST:$ENV_FILE"
              exit 1
            fi

            # Keep backup in sync after successful restore/presence
            cp -a ".env" "$ENV_BACKUP"

            docker network create proxy 2>/dev/null || true

            docker compose -f docker-compose.colocate.yml build --no-cache
            docker compose -f docker-compose.colocate.yml up -d --force-recreate

            echo "Waiting for API..."
            for i in $(seq 1 12); do
              if curl -sf http://127.0.0.1:3001/health > /dev/null 2>&1; then
                echo "API is healthy"
                break
              fi
              sleep 5
            done

            echo "Seeding App Review accounts..."
            docker compose -f docker-compose.colocate.yml exec -T api \
              node scripts/seed-test-accounts.js \
              || echo "WARN: reviewer seeding failed — run it manually"

            docker compose -f docker-compose.colocate.yml ps
            docker image prune -f

      - name: Notify success
        if: success()
        run: echo "✅ Server deployed successfully"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed — check logs above"
